name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recovery_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: recovery_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery_app -d recovery_operations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://recovery_app:ci_password@localhost:5432/recovery_operations
      TEST_DATABASE_URL: postgresql+psycopg://recovery_app:ci_password@localhost:5432/recovery_operations_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create test database
        run: |
          PGPASSWORD=ci_password createdb \
            -h localhost \
            -U recovery_app \
            recovery_operations_test

      - name: Run tests
        run: python -m pytest -v
